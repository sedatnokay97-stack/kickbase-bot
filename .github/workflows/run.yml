name: Kickbase Bot Execution

on:
  workflow_dispatch:
  schedule:
    # GitHub-Cron laeuft immer in UTC.
    # Deutschland: Sommerzeit = UTC+2, Winterzeit = UTC+1.
    # Kickbase-Marktwert-Update: ca. 22:00 deutscher Zeit.
    #
    # Krumme Minuten, weil GitHub geplante Laeufe zu vollen und halben
    # Stunden stark verzoegert oder bei Last komplett verwirft.
    # Die Zeiten liegen sommers wie winters auf der richtigen Seite des
    # Updates - sonst kippt die Logik bei der Zeitumstellung Ende Oktober.
    #
    # UTC 10:07  ->  12:07 Sommer / 11:07 Winter  (Tagwert)
    # UTC 19:20  ->  21:20 Sommer / 20:20 Winter  (VOR dem Update)
    # UTC 21:20  ->  23:20 Sommer / 22:20 Winter  (NACH dem Update)
    - cron: '7 10 * * *'
    - cron: '20 19 * * *'
    - cron: '20 21 * * *'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run Kickbase bot
        env:
          KB_EMAIL: ${{ secrets.KB_EMAIL }}
          KB_PASSWORD: ${{ secrets.KB_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main.py
