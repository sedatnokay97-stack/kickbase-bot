name: Kickbase 12h Bot

on:
  schedule:
    - cron: '0 */12 * * *' # Alle 12 Stunden automatisch
  workflow_dispatch: # Erlaubt manuelles Testen per Klick

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Pakete installieren
        run: pip install kickbase-api requests
      - name: Skript ausführen
        env:
          KB_EMAIL: ${{ secrets.KB_EMAIL }}
          KB_PASSWORD: ${{ secrets.KB_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
